name: Release

on:
  push:
    branches:
      - main
      - rc/*

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: cycjimmy/semantic-release-action@v6.0.0
        # conventional-changelog-conventionalcommits is held at 9.x: v10 needs
        # conventional-changelog-writer@9, which semantic-release@25 does not ship.
        # semantic_version is pinned to ^25 because @semantic-release/npm's OIDC
        # trusted-publishing support only landed in v13, bundled starting with
        # semantic-release v25 (the action's own default is still v24).
        with:
          semantic_version: '^25.0.9'
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
        env:
          FORCE_COLOR: 1
          GITHUB_TOKEN: ${{ github.token }}
